t-in local illustration.","toast.imageUnsupported":"This channel does not support image generation; continuing with built-in illustrations.","toast.localTest":"Local channel needs no connection test · it makes zero network requests.","toast.needKey":"Please enter an API Key first (stored on this device only).","toast.testOk":"Connected · {ms}ms · {tokens} tokens left · {calls}/60 API calls today","toast.proxyAdvice":' Try enabling "relay via local proxy".',"toast.testFail":"Test failed — check the Base URL, model name and key.","toast.recordsCleared":"Local learning records and request log cleared.","toast.scoringTitle":"AI is listening to your pronunciation…","toast.scoringSub":"Scanning word by word · automatically falls back to local scoring on timeout","toast.duoTitle":"Pair practice","toast.duoText":"· Student A scored {score}; now it is student B's turn on the same card","toast.duoSwitch":"Switch to student B","toast.duoDone":"Both students finished: A {a} pts · B {b} pts","prompt.adviceLang":"simple English","prompt.adviceRule":'Write the "advice" field in {lang}. Keep all other fields unchanged.',"ph.1":"Put the tip of your tongue gently between your teeth and blow; do not say /s/.","ph.2":"Same tongue position as /θ/, but vibrate your vocal cords; do not say /z/.","ph.3":"Curl the tongue tip back without touching the roof; round your lips slightly; do not say /l/.","ph.4":"Rest your upper teeth lightly on your lower lip and vibrate your vocal cords; do not say /w/.","ph.5":'Open your mouth wide with a low, flat tongue — between "ah" and "ae".',"ph.6":"Push the lips slightly forward, raise the tongue toward the hard palate; do not say /s/.","ph.7":'Block the airflow first, then release it with friction — like "ch" but shorter.',"ph.8":"Same tongue position as /tʃ/, but vibrate your vocal cords.","ph.9":"Press the back of the tongue against the soft palate and let air out through the nose; do not add a /g/.","ph.10":"Touch the tongue tip to the alveolar ridge; for a dark l at the end, raise the back of the tongue slightly.","ph.11":"Round the lips tightly, then glide open quickly; do not say /v/.","ph.12":"Raise the tongue toward the hard palate, then glide quickly into the next vowel.","ph.13":"A voiced /s/ — do not swallow the final sound.","ph.14":"Keep the tongue tip close to the alveolar ridge with a narrow gap; do not add an extra vowel.","ph.15":"Open the mouth naturally, tongue centred and slightly back; keep it short and crisp.","ph.16":"Open wide, lower and pull the tongue back, and hold the sound longer.","ph.17":"Round and slightly push the lips forward; keep it long and do not say /o/.","ph.18":"Keep the tongue centred and lips relaxed; add an r-colour in American English.","ph.19":"Spread the corners of your mouth and hold the sound long enough.","ph.20":"Shorter and laxer than /iː/ — do not stretch the mouth too wide.","ph.21":"Round the lips very small and tight; hold the sound long.","ph.22":"Short and lax, with only slightly rounded lips.","ph.23":"Half-open mouth, front-mid tongue; do not turn it into /æ/.","ph.24":"The lightest, shortest central vowel — do not stress every syllable.","ph.25":"Glide from /a/ to /ɪ/, strong at the start and light at the end.","ph.26":"Glide from /a/ to /ʊ/, lips closing from wide to small.","ph.27":"Glide from /ɔː/ to /ɪ/, lips changing from round to flat.","ph.28":"Glide from /e/ to /ɪ/; do not say it as one flat vowel.","ph.29":"Glide from /ə/ to /ʊ/, rounding the lips gradually.","ph.30":"Say consonant clusters as one continuous sound — no extra vowel in the middle, and do not drop the final consonant.","ph.generic":"Slow down, say every syllable clearly, and do not swallow the final consonant."},q1={"app.title":"HabitatQuest · 口语练习助手（本地原型）","app.langName.zh":"中文","app.langName.en":"English","app.language":"界面语言","app.switchLanguage":"切换中英文界面","phase.card":"看图","phase.listening":"听示范","phase.recording":"跟读","phase.scoring":"判分","phase.feedback":"诊断","phase.question"
